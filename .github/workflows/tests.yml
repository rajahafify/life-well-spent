name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Godot
        run: |
          curl -L -o godot.zip \
            "https://downloads.godotengine.org/?version=4.6.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -o godot.zip
          chmod +x Godot_v*linux.x86_64

      - name: Run test runner and check output
        run: |
          set -o pipefail
          ./Godot_v*linux.x86_64 --headless --quit tests/test_runner.tscn 2>&1 | tee godot-test-output.log
          grep -Eq "[0-9]+ tests, [0-9]+ passed, 0 failed" godot-test-output.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|WARNING:" godot-test-output.log \
            | grep -Ev "ObjectDB instances leaked|resources still in use|at: cleanup|at: clear"; then
            echo "Unexpected Godot warning/error output detected" >&2
            exit 1
          fi
